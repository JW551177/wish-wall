<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祈福牆 — 心願天燈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=400;600;700&family=Noto+Sans+TC:wght=300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --night: #0a0618;
    --deep: #110d2a;
    --ink: #1c1635;
    --gold: #f5c842;
    --gold-dim: #c9952e;
    --amber: #f08c2a;
    --paper: #fff8e7;
    --paper-aged: #f0e6c8;
    --red: #c0392b;
    --red-warm: #e84c3d;
    --mist: rgba(245, 200, 66, 0.08);
    --font-serif: 'Noto Serif TC', serif;
    --font-sans: 'Noto Sans TC', sans-serif;
  }

  body {
    background: var(--night);
    color: var(--paper);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Stars background */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) infinite ease-in-out var(--del, 0s);
    opacity: var(--o, 0.6);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--o, 0.6); transform: scale(1); }
    50% { opacity: 0.1; transform: scale(0.6); }
  }

  /* Moon glow */
  .moon {
    position: fixed;
    top: 60px; right: 80px;
    width: 90px; height: 90px;
    background: radial-gradient(circle at 38% 40%, #fff8d0 0%, #f5e070 40%, #c9a02a 100%);
    border-radius: 50%;
    box-shadow: 0 0 40px 20px rgba(245, 200, 66, 0.25), 0 0 80px 40px rgba(245, 200, 66, 0.1);
    z-index: 1;
    animation: moonGlow 6s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%, 100% { box-shadow: 0 0 40px 20px rgba(245,200,66,0.25), 0 0 80px 40px rgba(245,200,66,0.1); }
    50% { box-shadow: 0 0 60px 30px rgba(245,200,66,0.35), 0 0 120px 60px rgba(245,200,66,0.15); }
  }

  /* Mountains silhouette */
  .mountains {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    z-index: 1;
    pointer-events: none;
  }

  /* Hero section */
  .hero {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 60px 20px 30px;
  }
  .hero-badge {
    display: inline-block;
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    border: 1px solid rgba(245,200,66,0.3);
    padding: 6px 20px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(245,200,66,0.5);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  .hero p {
    font-size: 15px;
    color: rgba(255,248,231,0.6);
    letter-spacing: 0.05em;
    font-weight: 300;
  }

  /* Form card */
  .form-wrap {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto 50px;
    padding: 0 20px;
  }
  .form-card {
    background: rgba(255,248,231,0.06);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 16px;
    padding: 28px 28px 24px;
    backdrop-filter: blur(8px);
  }
  .form-card label {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gold-dim);
    margin-bottom: 8px;
    font-family: var(--font-serif);
  }
  .form-row { margin-bottom: 16px; }
  .form-card input[type="text"],
  .form-card textarea {
    width: 100%;
    background: rgba(255,248,231,0.06);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--paper);
    font-family: var(--font-sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    resize: none;
  }
  .form-card input[type="text"]:focus,
  .form-card textarea:focus {
    border-color: rgba(245,200,66,0.6);
    background: rgba(255,248,231,0.1);
  }
  .form-card input::placeholder,
  .form-card textarea::placeholder { color: rgba(255,248,231,0.3); }

  .color-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .color-label {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gold-dim);
    font-family: var(--font-serif);
    min-width: 60px;
  }
  .color-option {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .color-option:hover { transform: scale(1.15); }
  .color-option.active { border-color: white; transform: scale(1.2); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #c9952e, #f5c842, #c9952e);
    background-size: 200% 100%;
    border: none;
    border-radius: 10px;
    color: var(--night);
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background-position 0.4s, transform 0.15s, box-shadow 0.3s;
    box-shadow: 0 4px 20px rgba(245,200,66,0.3);
  }
  .submit-btn:hover {
    background-position: 100% 0;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(245,200,66,0.5);
  }
  .submit-btn:active { transform: scale(0.98) translateY(0); }

  /* Wall section */
  .wall-section {
    position: relative;
    z-index: 2;
    padding: 0 20px 120px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .wall-title {
    text-align: center;
    font-family: var(--font-serif);
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(245,200,66,0.5);
    margin-bottom: 30px;
  }
  .wall-title span {
    display: inline-block;
    position: relative;
  }
  .wall-title span::before,
  .wall-title span::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40px; height: 1px;
    background: rgba(245,200,66,0.25);
  }
  .wall-title span::before { right: calc(100% + 12px); }
  .wall-title span::after { left: calc(100% + 12px); }

  /* Sky lantern container */
  #wall {
    position: relative;
    min-height: 400px;
  }

  /* Individual lanterns */
  .lantern-wrap {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: floatUp var(--dur, 18s) linear infinite;
    animation-delay: var(--delay, 0s);
    transform-origin: center top;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    5% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(-90vh) translateX(var(--drift, 20px)) rotate(var(--rot, 5deg)); opacity: 0; }
  }

  .lantern {
    position: relative;
    width: var(--size, 130px);
    cursor: pointer;
    transition: filter 0.3s;
    filter: drop-shadow(0 0 10px var(--glow));
  }
  .lantern svg { width: 100%; display: block; }

  /* 調整文字提示框：平時微透明，滑鼠懸停時放大變清晰 */
  .wish-popup {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-5px);
    background: rgba(16, 12, 38, 0.85);
    border: 1px solid rgba(245, 200, 66, 0.3);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 10;
    opacity: 0.75;
    transition: all 0.3s ease;
  }
  .lantern:hover .wish-popup {
    opacity: 1;
    background: rgba(28, 22, 53, 0.95);
    border-color: rgba(245, 200, 66, 0.8);
    transform: translateX(-50%) translateY(-12px) scale(1.05);
  }
  .wish-name {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 2px;
    font-family: var(--font-serif);
  }

  /* String */
  .lantern-string {
    width: 1px;
    background: rgba(245,200,66,0.4);
    height: 16px;
  }

  /* Launch animation */
  @keyframes launchBurst {
    0% { transform: scale(0.5) translateY(30px); opacity: 0; }
    40% { transform: scale(1.1) translateY(-10px); opacity: 1; }
    70% { transform: scale(0.95) translateY(0); }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .launching {
    animation: launchBurst 0.6s cubic-bezier(0.22,1,0.36,1) forwards !important;
  }

  /* Count badge */
  .count-badge {
    display: inline-block;
    background: rgba(245,200,66,0.15);
    border: 1px solid rgba(245,200,66,0.3);
    color: var(--gold);
    font-family: var(--font-serif);
    font-size: 13px;
    padding: 4px 16px;
    border-radius: 20px;
    margin: 0 auto 24px;
    text-align: center;
    display: block;
    width: fit-content;
  }

  /* Floating particles */
  .spark {
    position: fixed;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--gold);
    pointer-events: none;
    z-index: 100;
    animation: sparkFly 1.2s ease-out forwards;
  }
  @keyframes sparkFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .hero h1 { font-size: 2rem; }
    .moon { width: 60px; height: 60px; top: 40px; right: 40px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>

<svg class="mountains" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,220 0,140 180,60 360,130 520,40 680,120 820,30 1000,110 1160,50 1320,100 1440,70 1440,220" fill="#0d0a22"/>
  <polygon points="0,220 0,170 120,110 280,160 420,90 560,150 700,80 860,140 1020,70 1160,130 1300,85 1440,115 1440,220" fill="#110d2a"/>
</svg>

<div class="hero">
  <div class="hero-badge">✦ 心願天燈祈福牆 ✦</div>
  <h1>許下你的心願</h1>
  <p>讓天燈帶著你的祝福，飛向星空</p>
</div>

<div class="form-wrap">
  <div class="form-card">
    <div class="form-row">
      <label>你的名字</label>
      <input type="text" id="nameInput" placeholder="請輸入姓名（選填）" maxlength="20">
    </div>
    <div class="form-row">
      <label>心願內容</label>
      <textarea id="wishInput" placeholder="寫下你最真誠的心願…" rows="3" maxlength="60"></textarea>
    </div>
    <div class="color-row">
      <span class="color-label">燈籠顏色</span>
      <div class="color-option active" data-color="red" style="background:#e84c3d;" title="紅色"></div>
      <div class="color-option" data-color="gold" style="background:#f5c842;" title="金色"></div>
      <div class="color-option" data-color="orange" style="background:#f08c2a;" title="橙色"></div>
      <div class="color-option" data-color="pink" style="background:#e87dbf;" title="粉色"></div>
      <div class="color-option" data-color="teal" style="background:#2ab8a0;" title="翠色"></div>
      <div class="color-option" data-color="purple" style="background:#9b59b6;" title="紫色"></div>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="launchLantern()">放 飛 天 燈 ✦</button>
  </div>
</div>

<div class="wall-section">
  <div class="wall-title"><span>飄浮的心願</span></div>
  <div class="count-badge" id="countBadge">正在連接星空伺服器... ✨</div>
  <div id="wall"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
// ⚠️ 請將此處替換成你在 Firebase 後台申請的專案 Config 資訊
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("wishes");

// ── Stars 星空背景 ──
(function() {
  const s = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    el.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*85}%;
      --d:${2+Math.random()*4}s;
      --del:${Math.random()*5}s;
      --o:${0.3+Math.random()*0.7};
    `;
    s.appendChild(el);
  }
})();

// ── 色系設定 ──
const COLORS = {
  red:    { body:'#e84c3d', mid:'#c0392b', dark:'#8e2217', glow:'rgba(232,76,61,0.7)',  char:'紅' },
  gold:   { body:'#f5e060', mid:'#f5c842', dark:'#c9952e', glow:'rgba(245,200,66,0.7)', char:'金' },
  orange: { body:'#f5b040', mid:'#f08c2a', dark:'#b5600f', glow:'rgba(240,140,42,0.7)', char:'橙' },
  pink:   { body:'#f0a0d4', mid:'#e87dbf', dark:'#b34d90', glow:'rgba(232,125,191,0.7)',char:'粉' },
  teal:   { body:'#5de0c8', mid:'#2ab8a0', dark:'#1a7d6e', glow:'rgba(42,184,160,0.7)', char:'翠' },
  purple: { body:'#c39bec', mid:'#9b59b6', dark:'#6c3483', glow:'rgba(155,89,182,0.7)', char:'紫' }
};

let selectedColor = 'red';

// 選擇顏色事件
document.querySelectorAll('.color-option').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.color-option').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    selectedColor = el.dataset.color;
  });
});

// ── 生成天燈 SVG ──
function buildLanternSVG(color, size) {
  const c = COLORS[color];
  return `<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="gf${color}" cx="50%" cy="60%" r="50%">
        <stop offset="0%" stop-color="rgba(255,255,200,0.9)"/>
        <stop offset="100%" stop-color="rgba(255,200,80,0)"/>
      </radialGradient>
    </defs>
    <ellipse cx="30" cy="66" rx="10" ry="7" fill="url(#gf${color})" opacity="0.6"/>
    <rect x="18" y="62" width="24" height="4" rx="2" fill="${c.dark}"/>
    <ellipse cx="30" cy="36" rx="24" ry="30" fill="${c.body}"/>
    <ellipse cx="30" cy="36" rx="12" ry="30" fill="${c.mid}" opacity="0.4"/>
    <ellipse cx="22" cy="28" rx="6" ry="10" fill="rgba(255,255,255,0.25)"/>
    <rect x="16" y="6" width="28" height="5" rx="2.5" fill="${c.dark}"/>
    <line x1="24" y1="66" x2="22" y2="76" stroke="${c.dark}" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="30" y1="66" x2="30" y2="78" stroke="${c.dark}" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="36" y1="66" x2="38" y2="76" stroke="${c.dark}" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="30" cy="70" rx="5" ry="6" fill="#fff5a0" opacity="0.8">
      <animate attributeName="rx" values="5;4;6;5" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="6;7;5;6" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="30" cy="69" rx="3" ry="4" fill="white" opacity="0.9">
      <animate attributeName="cy" values="69;68;70;69" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
  </svg>`;
}

// ── 牆面狀態與渲染 ──
const WALL_HEIGHT = 400;
let activeLanterns = [];
let totalWishCount = 0;
const wall = document.getElementById('wall');
wall.style.height = WALL_HEIGHT + 'px';
wall.style.position = 'relative';
wall.style.overflow = 'hidden';

function countBadgeUpdate() {
  const el = document.getElementById('countBadge');
  if (totalWishCount === 0) {
    el.textContent = '尚無心願，成為第一位許願者 ✨';
  } else {
    el.textContent = `✦ 已有 ${totalWishCount} 個心願飄向星空 ✦`;
  }
}

// 將天燈推到畫面上
function spawnLantern(wish, animate) {
  const color = wish.color || 'red';
  const c = COLORS[color];
  const size = 64 + Math.floor(Math.random() * 28);
  const dur = 14 + Math.random() * 10;
  const left = 5 + Math.random() * 80;
  const drift = (Math.random() - 0.5) * 80;
  const rot = (Math.random() - 0.5) * 14;
  
  // 如果是舊的歷史天燈（網頁剛開時），隨機給予負數 delay 讓它們均勻分布在半空中
  // 如果是有人剛送出的新天燈，delay 為 0，從底部升起
  const delay = animate ? 0 : -(Math.random() * dur);

  const wrap = document.createElement('div');
  wrap.className = 'lantern-wrap';
  wrap.style.cssText = `
    left: ${left}%;
    bottom: 0px;
    --dur: ${dur}s;
    --delay: ${delay}s;
    --drift: ${drift}px;
    --rot: ${rot}deg;
    animation: floatUp ${dur}s linear ${delay}s infinite;
  `;

  const lanternEl = document.createElement('div');
  lanternEl.className = 'lantern';
  lanternEl.style.cssText = `width:${size}px; --glow:${c.glow};`;
  lanternEl.innerHTML = buildLanternSVG(color, size);

  // 內容視窗
  const popup = document.createElement('div');
  popup.className = 'wish-popup';
  const nameHtml = wish.name ? `<div class="wish-name">${escHtml(wish.name)}</div>` : '';
  popup.innerHTML = `${nameHtml}<div>${escHtml(wish.wish)}</div>`;
  lanternEl.appendChild(popup);

  const string = document.createElement('div');
  string.className = 'lantern-string';

  wrap.appendChild(lanternEl);
  wrap.appendChild(string);
  wall.appendChild(wrap);

  if (animate) {
    lanternEl.style.animation = 'none';
    wrap.style.animation = 'none';
    setTimeout(() => {
      lanternEl.classList.add('launching');
      wrap.style.animation = `floatUp ${dur}s linear 0.5s infinite`;
      setTimeout(() => lanternEl.classList.remove('launching'), 700);
    }, 50);
  }

  activeLanterns.push(wrap);
  
  // 畫面上最多同時留 40 盞，避免天燈過多卡頓
  if (activeLanterns.length > 40) {
    const old = activeLanterns.shift();
    if (old && old.parentNode) old.parentNode.removeChild(old);
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 金星粒子特效 ──
function spawnSparks(x, y) {
  for (let i = 0; i < 14; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 80;
    sp.style.cssText = `
      left:${x}px; top:${y}px;
      --sx:${Math.cos(angle)*dist}px;
      --sy:${Math.sin(angle)*dist - 40}px;
      background:${Math.random()>0.5 ? '#f5c842' : '#f08c2a'};
      animation-delay:${Math.random()*0.15}s;
      animation-duration:${0.8+Math.random()*0.5}s;
    `;
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1400);
  }
}

// ── 發送天燈到 Firebase ──
function launchLantern() {
  const wishText = document.getElementById('wishInput').value.trim();
  const nameText = document.getElementById('nameInput').value.trim();

  if (!wishText) {
    document.getElementById('wishInput').focus();
    document.getElementById('wishInput').style.borderColor = 'rgba(232,76,61,0.8)';
    setTimeout(()
